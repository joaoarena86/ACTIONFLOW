<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ActionFlow | Workflow Manager Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-premium {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: #0a0a0a;
            opacity: 1;
        }
        
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 215, 0, 0.6) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(139, 92, 246, 0.6) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
        
        .energy-flow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .energy-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFD700;
            animation: energyMove 8s linear infinite;
        }
        
        .energy-particle-vertical {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #8B5CF6;
            border-radius: 50%;
            box-shadow: 0 0 8px #8B5CF6;
            animation: energyMoveVertical 10s linear infinite;
        }
        
        @keyframes energyMove {
            0% { transform: translateX(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(calc(100vw + 10px)); opacity: 0; }
        }
        
        @keyframes energyMoveVertical {
            0% { transform: translateY(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(calc(100vh + 10px)); opacity: 0; }
        }
        
        .radar-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(255,215,0,0.3), rgba(139,92,246,0.2), transparent);
            animation: radarGlow 4s ease-in-out infinite;
        }
        
        @keyframes radarGlow { 0%,100% { opacity: 0.3; transform: translate(-50%,-50%) scale(0.9); } 50% { opacity: 0.8; transform: translate(-50%,-50%) scale(1.1); } }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: radial-gradient(circle, #FFD700, #8B5CF6);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 14s linear infinite;
        }
        
        @keyframes floatParticle { 0% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(-10vh) translateX(40px); opacity: 0; } }
        
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        
        .glass-card {
            background: rgba(20, 10, 40, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .glass-card:hover {
            border-color: #FFD700;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255,215,0,0.15);
        }
        
        .btn {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 30px;
            color: #FFD700;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .btn:hover { background: rgba(255,215,0,0.15); border-color: #FFD700; transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #8B5CF6); border: none; color: #000; }
        .btn-primary:hover { background: linear-gradient(135deg, #FFD700, #8B5CF6); box-shadow: 0 0 20px rgba(255,215,0,0.4); }
        .btn-danger { border-color: rgba(255,0,0,0.5); color: #ff4444; }
        .btn-danger:hover { background: rgba(255,0,0,0.15); }
        
        .input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10,10,10,0.7);
            border: 1px solid #8B5CF6;
            border-radius: 12px;
            color: #fff;
            margin-bottom: 12px;
        }
        .input:focus { outline: none; border-color: #FFD700; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #FFD700, #8B5CF6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .clock { text-align: center; background: rgba(20,10,40,0.3); backdrop-filter: blur(8px); padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(255,215,0,0.3); }
        .time { font-size: 1.2rem; font-weight: 600; color: #FFD700; }
        .date { font-size: 0.7rem; color: #aaa; }
        
        .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(20,10,40,0.3); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid rgba(255,215,0,0.2); }
        .stat-number { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #FFD700, #8B5CF6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
        .workflow-list { max-height: 300px; overflow-y: auto; }
        .workflow-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .workflow-item:hover, .workflow-item.active { border-color: #FFD700; background: rgba(255,215,0,0.1); }
        
        .objetivo-card { background: rgba(20,10,40,0.3); border: 1px solid rgba(139,92,246,0.3); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .objetivo-title { font-weight: 500; }
        .objetivo-title.completed { text-decoration: line-through; opacity: 0.6; }
        .priority-high { border-left: 3px solid #ff3366; }
        .priority-medium { border-left: 3px solid #ffa502; }
        .priority-low { border-left: 3px solid #2ed573; }
        
        .step-card { background: rgba(20,10,40,0.3); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .step-card.locked { opacity: 0.5; border-color: rgba(255,0,0,0.3); }
        .step-card.completed { border-color: #00ffaa; background: rgba(0,255,170,0.05); }
        .step-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .step-status { background: rgba(255,215,0,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #FFD700; }
        .step-details { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,215,0,0.2); }
        .subtask-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .comment-item { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 0.8rem; }
        
        .chart-container { margin: 20px 0; padding: 20px; background: rgba(20,10,40,0.3); border-radius: 16px; border: 1px solid rgba(255,215,0,0.2); }
        canvas { max-height: 250px; width: 100%; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: rgba(20,10,40,0.95); backdrop-filter: blur(20px); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; border: 1px solid rgba(255,215,0,0.4); }
        .modal-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,215,0,0.2); }
        .tab { background: none; border: none; padding: 10px 20px; color: #aaa; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: #FFD700; border-bottom-color: #FFD700; }
        
        .hidden { display: none; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="bg-premium"></div>
    <div class="animated-bg">
        <div class="grid-lines"></div>
        <div class="energy-flow" id="energyFlow"></div>
        <div class="radar-pulse"></div>
        <div class="vignette"></div>
    </div>

    <div class="container" id="app">
        <div id="loginScreen">
            <div style="max-width: 450px; margin: 80px auto;">
                <div class="glass-card" style="text-align:center">
                    <div class="logo" style="font-size:2.5rem">ActionFlow</div>
                    <p style="margin-bottom:30px; color:#aaa">Workflow Manager</p>
                    <div id="loginPanel">
                        <input type="text" id="loginUser" class="input" placeholder="Usuário">
                        <input type="password" id="loginPass" class="input" placeholder="Senha">
                        <button id="btnLogin" class="btn btn-primary" style="width:100%">Entrar</button>
                        <div style="margin-top:15px"><span id="showReg" class="btn" style="padding:8px 20px">Criar Conta</span></div>
                    </div>
                    <div id="regPanel" class="hidden">
                        <input type="text" id="regUser" class="input" placeholder="Usuário">
                        <input type="password" id="regPass" class="input" placeholder="Senha (min 4)">
                        <button id="btnReg" class="btn btn-primary" style="width:100%">Criar Conta</button>
                        <div style="margin-top:15px"><span id="backLogin" class="btn" style="padding:8px 20px">← Voltar</span></div>
                    </div>
                    <div id="loginMsg" style="margin-top:15px; font-size:0.8rem; color:#ff6496"></div>
                </div>
            </div>
        </div>

        <div id="mainScreen" class="hidden">
            <div class="header">
                <div class="logo">ActionFlow</div>
                <div class="clock"><div class="time" id="clockTime">--:--:--</div><div class="date" id="clockDate">---</div></div>
                <div><button id="openSettings" class="btn"><i class="fas fa-cog"></i> Config</button> <button id="logoutBtn" class="btn">Sair</button></div>
            </div>

            <div class="stats">
                <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div>Workflows</div></div>
                <div class="stat-card"><div class="stat-number" id="statProgress">0</div><div>% Geral</div></div>
                <div class="stat-card"><div class="stat-number" id="statActive">0</div><div>Ativos</div></div>
            </div>

            <div class="chart-container"><canvas id="chartWorkflows"></canvas></div>

            <div class="grid-2">
                <div class="glass-card"><h3 style="color:#FFD700">➕ Criar Workflow</h3><input type="text" id="newWfName" class="input" placeholder="Nome"><button id="createWf" class="btn btn-primary" style="width:100%">Criar</button></div>
                <div class="glass-card"><h3 style="color:#FFD700">📁 Meus Workflows</h3><div id="workflowsList"></div><button id="deleteWf" class="btn btn-danger" style="width:100%; margin-top:15px">Excluir</button></div>
            </div>

            <div id="workflowPanel" class="hidden glass-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px">
                    <h2 id="currentWfName" style="color:#FFD700"></h2>
                    <div style="display:flex; gap:10px">
                        <button id="saveAndExit" class="btn btn-primary">💾 Salvar e Sair</button>
                        <button id="closeWfPanel" class="btn">Fechar</button>
                    </div>
                </div>

                <h3 style="color:#8B5CF6">🎯 Objetivos</h3>
                <div id="objetivosList"></div>
                <div style="display:flex; gap:10px; margin:15px 0; flex-wrap:wrap">
                    <input type="text" id="newObjTitle" class="input" style="flex:1" placeholder="Título">
                    <textarea id="newObjDesc" class="input" style="flex:2" rows="1" placeholder="Descrição"></textarea>
                    <input type="date" id="newObjDate" class="input" style="width:auto">
                    <select id="newObjPriority" class="input" style="width:auto"><option value="low">Baixa</option><option value="medium">Média</option><option value="high">Alta</option></select>
                    <button id="addObjetivo" class="btn btn-primary">+</button>
                </div>

                <h3 style="color:#8B5CF6; margin-top:20px">📌 Etapas</h3>
                <div id="stepsList"></div>
                <div style="display:flex; gap:10px; margin-top:15px; flex-wrap:wrap">
                    <input type="text" id="newStepName" class="input" style="flex:1" placeholder="Nome">
                    <textarea id="newStepDesc" class="input" style="flex:2" rows="1" placeholder="Descrição"></textarea>
                    <input type="date" id="newStepDate" class="input" style="width:auto">
                    <button id="addStep" class="btn btn-primary">+</button>
                </div>

                <div class="chart-container"><canvas id="chartSteps"></canvas></div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal"><div class="modal-content"><h2 style="color:#FFD700">⚙️ Configurações</h2><div class="modal-tabs"><button class="tab active" data-tab="seg">Segurança</button><button class="tab" data-tab="perigo">Perigo</button></div><div id="tabSeg"><input type="password" id="oldPass" class="input" placeholder="Senha atual"><input type="password" id="newPass" class="input" placeholder="Nova senha (min 4)"><input type="password" id="confirmPass" class="input" placeholder="Confirmar"><button id="changePassBtn" class="btn btn-primary" style="width:100%">Alterar Senha</button></div><div id="tabPerigo" class="hidden"><button id="deleteAllWfBtn" class="btn btn-danger" style="width:100%; margin-bottom:10px">Excluir TODOS</button><button id="deleteAccountBtn" class="btn btn-danger" style="width:100%">Excluir Conta</button></div><button id="closeModal" class="btn" style="width:100%; margin-top:20px">Fechar</button></div></div>

    <script>
        let currentUser = null;
        let users = {};
        let workflows = [];
        let selectedWf = null;
        let wfChart = null, stepsChart = null;

        function loadData() { let s = localStorage.getItem('actionflow_users'); users = s ? JSON.parse(s) : {}; }
        function saveUsers() { localStorage.setItem('actionflow_users', JSON.stringify(users)); }
        function saveWorkflows() { if(currentUser) localStorage.setItem(`actionflow_${currentUser}`, JSON.stringify(workflows)); }
        function loadWorkflows() { if(currentUser) { let s = localStorage.getItem(`actionflow_${currentUser}`); workflows = s ? JSON.parse(s) : []; renderWorkflows(); updateStats(); } }

        function updateClock() { const now = new Date(); document.getElementById('clockTime').innerText = now.toLocaleTimeString('pt-BR'); document.getElementById('clockDate').innerText = now.toLocaleDateString('pt-BR'); }
        setInterval(updateClock, 1000); updateClock();

        function updateStats() {
            let total = workflows.length;
            let completed = workflows.reduce((acc,wf)=>{ let prog=wf.objetivos?.filter(o=>o.completed).length||0; let totalObj=wf.objetivos?.length||1; return acc+(prog/totalObj*100); },0)/total;
            let active = workflows.filter(wf=>wf.steps?.filter(s=>s.status!=='completed').length).length;
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statProgress').innerText = Math.round(completed) || 0;
            document.getElementById('statActive').innerText = active;
            renderWorkflowsChart();
        }

        function renderWorkflows() {
            let container = document.getElementById('workflowsList');
            if(!workflows.length) { container.innerHTML = '<div style="text-align:center; padding:20px;">Nenhum workflow</div>'; return; }
            container.innerHTML = '';
            workflows.forEach((wf,idx)=>{
                let div = document.createElement('div'); div.className = 'workflow-item';
                if(selectedWf===idx) div.classList.add('active');
                let objProgress = wf.objetivos?.length ? Math.round(wf.objetivos.filter(o=>o.completed).length/wf.objetivos.length*100) : 0;
                div.innerHTML = `<span>${wf.name}</span><span style="color:#FFD700">${objProgress}%</span>`;
                div.onclick = () => selectWorkflow(idx);
                container.appendChild(div);
            });
        }

        function selectWorkflow(idx) {
            selectedWf = idx;
            renderWorkflows();
            document.getElementById('workflowPanel').classList.remove('hidden');
            document.getElementById('currentWfName').innerText = workflows[idx].name;
            renderObjetivos();
            renderSteps();
            renderStepsChart();
            updateStats();
        }

        function renderObjetivos() {
            let wf = workflows[selectedWf];
            let container = document.getElementById('objetivosList');
            if(!wf.objetivos?.length) { container.innerHTML = '<div style="text-align:center; padding:20px;">Nenhum objetivo</div>'; return; }
            container.innerHTML = '';
            wf.objetivos.forEach((obj,idx)=>{
                let div = document.createElement('div'); div.className = `objetivo-card priority-${obj.priority}`;
                div.innerHTML = `<div><input type="checkbox" ${obj.completed?'checked':''} data-obj-idx="${idx}" style="margin-right:10px"><span class="objetivo-title ${obj.completed?'completed':''}">${obj.title}</span><br><small style="color:#aaa">${obj.description||''} | Vence: ${obj.dueDate||'sem data'}</small></div>
                                <div><button class="btn" style="padding:5px 10px" data-edit-obj="${idx}"><i class="fas fa-edit"></i></button></div>`;
                container.appendChild(div);
            });
            document.querySelectorAll('.objetivo-card input[type="checkbox"]').forEach(cb=>{ cb.onchange=(e)=>{ let idx=parseInt(e.target.dataset.objIdx); toggleObjetivo(idx, e.target.checked); }; });
            document.querySelectorAll('[data-edit-obj]').forEach(btn=>{ btn.onclick=(e)=>{ let idx=parseInt(btn.dataset.editObj); editObjetivo(idx); }; });
        }

        function toggleObjetivo(idx,checked) { workflows[selectedWf].objetivos[idx].completed = checked; saveWorkflows(); renderObjetivos(); updateStats(); }
        function editObjetivo(idx) { let obj = workflows[selectedWf].objetivos[idx]; let novo = prompt('Editar título:', obj.title); if(novo) obj.title = novo; let novaDesc = prompt('Editar descrição:', obj.description||''); obj.description = novaDesc; saveWorkflows(); renderObjetivos(); }
        function addObjetivo(title, desc, dueDate, priority) { if(!title) return; if(!workflows[selectedWf].objetivos) workflows[selectedWf].objetivos = []; workflows[selectedWf].objetivos.push({ title, description: desc, dueDate, priority, completed: false }); saveWorkflows(); renderObjetivos(); updateStats(); }

        function renderSteps() {
            let wf = workflows[selectedWf];
            if(!wf.steps) wf.steps = [];
            let container = document.getElementById('stepsList');
            if(!wf.steps.length) { container.innerHTML = '<div style="text-align:center; padding:20px;">Nenhuma etapa</div>'; return; }
            container.innerHTML = '';
            wf.steps.forEach((step,idx)=>{
                let isLocked = idx > (wf.currentIdx || 0);
                let isCompleted = step.status === 'completed';
                let stepDiv = document.createElement('div'); stepDiv.className = 'step-card';
                if(isLocked) stepDiv.classList.add('locked');
                if(isCompleted) stepDiv.classList.add('completed');
                stepDiv.innerHTML = `<div class="step-header"><span><strong>${idx+1}. ${step.name}</strong></span><span class="step-status">${step.status||'pending'}</span></div>
                                    <div style="font-size:0.8rem; color:#aaa">${step.description||''}</div>
                                    <div style="font-size:0.7rem; color:#FFD700">📅 ${step.dueDate||'Sem data'}</div>
                                    <div class="step-details hidden" id="stepDetails-${idx}">
                                        <div><strong>Sub-etapas:</strong><div id="subtasks-${idx}"></div>
                                        <input type="text" id="newSubtask-${idx}" class="input" style="margin-top:5px" placeholder="Nova sub-etapa"><button class="btn" style="padding:4px 12px" data-add-subtask="${idx}">+</button></div>
                                        <div style="margin-top:10px"><strong>Comentários:</strong><div id="comments-${idx}"></div>
                                        <input type="text" id="newComment-${idx}" class="input" style="margin-top:5px" placeholder="Comentário"><button class="btn" style="padding:4px 12px" data-add-comment="${idx}">Enviar</button></div>
                                    </div>
                                    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
                                        ${!isLocked && step.status !== 'completed' ? `<button class="btn" data-complete-step="${idx}" style="padding:4px 12px">✅ Concluir</button>` : ''}
                                        ${step.status === 'completed' ? `<button class="btn" data-reopen-step="${idx}" style="padding:4px 12px">🔄 Reabrir</button>` : ''}
                                        <button class="btn btn-danger" data-delete-step="${idx}" style="padding:4px 12px">🗑️ Excluir</button>
                                        <button class="btn" data-toggle-step="${idx}" style="padding:4px 12px">📋 Detalhes</button>
                                    </div>`;
                container.appendChild(stepDiv);
                let subtasksDiv = document.getElementById(`subtasks-${idx}`);
                if(step.subtasks?.length) step.subtasks.forEach(st=>{ subtasksDiv.innerHTML += `<div class="subtask-item"><input type="checkbox" ${st.completed?'checked':''} data-subtask-idx="${idx}" data-subtask-st="${st.id}"> <span>${st.name}</span></div>`; });
                let commentsDiv = document.getElementById(`comments-${idx}`);
                if(step.comments?.length) step.comments.forEach(c=>{ commentsDiv.innerHTML += `<div class="comment-item"><strong>${c.user}</strong> (${c.date}): ${c.text}</div>`; });
            });
            document.querySelectorAll('[data-complete-step]').forEach(btn=>{ btn.onclick=(e)=>{ let idx=parseInt(btn.dataset.completeStep); completeStep(idx); }; });
            document.querySelectorAll('[data-reopen-step]').forEach(btn=>{ btn.onclick=(e)=>{ let idx=parseInt(btn.dataset.reopenStep); reopenStep(idx); }; });
            document.querySelectorAll('[data-delete-step]').forEach(btn=>{ btn.onclick=(e)=>{ let idx=parseInt(btn.dataset.deleteStep); deleteStep(idx); }; });
            document.querySelectorAll('[data-toggle-step]').forEach(btn=>{ btn.onclick=(e)=>{ let details=document.getElementById(`stepDetails-${btn.dataset.toggleStep}`); if(details) details.classList.toggle('hidden'); }; });
            document.querySelectorAll('[data-add-subtask]').forEach(btn=>{ btn.onclick=(e)=>{ let stepIdx=parseInt(btn.dataset.addSubtask); addSubtask(stepIdx, document.getElementById(`newSubtask-${stepIdx}`).value); document.getElementById(`newSubtask-${stepIdx}`).value=''; }; });
            document.querySelectorAll('[data-add-comment]').forEach(btn=>{ btn.onclick=(e)=>{ let stepIdx=parseInt(btn.dataset.addComment); addComment(stepIdx, document.getElementById(`newComment-${stepIdx}`).value); document.getElementById(`newComment-${stepIdx}`).value=''; }; });
            document.querySelectorAll('.subtask-item input').forEach(cb=>{ cb.onchange=(e)=>{ let stepIdx=parseInt(cb.dataset.subtaskIdx); let subtaskId=cb.dataset.subtaskSt; toggleSubtask(stepIdx, subtaskId, cb.checked); }; });
        }

        function completeStep(stepIdx) { let wf = workflows[selectedWf]; wf.steps[stepIdx].status = 'completed'; if(wf.currentIdx===undefined) wf.currentIdx=0; if(stepIdx===wf.currentIdx) wf.currentIdx++; saveWorkflows(); renderSteps(); renderStepsChart(); updateStats(); }
        function reopenStep(stepIdx) { let wf = workflows[selectedWf]; wf.steps[stepIdx].status = 'pending'; if(wf.currentIdx>stepIdx) wf.currentIdx=stepIdx; saveWorkflows(); renderSteps(); renderStepsChart(); updateStats(); }
        function deleteStep(stepIdx) { if(confirm('Excluir etapa?')) { let wf=workflows[selectedWf]; wf.steps.splice(stepIdx,1); if(wf.currentIdx>=wf.steps.length) wf.currentIdx=wf.steps.length; saveWorkflows(); renderSteps(); renderStepsChart(); updateStats(); } }
        function addSubtask(stepIdx,name){if(!name)return;let wf=workflows[selectedWf];if(!wf.steps[stepIdx].subtasks)wf.steps[stepIdx].subtasks=[];wf.steps[stepIdx].subtasks.push({id:Date.now().toString(),name,completed:false});saveWorkflows();renderSteps();}
        function toggleSubtask(stepIdx,id,checked){let wf=workflows[selectedWf];let subtask=wf.steps[stepIdx].subtasks.find(s=>s.id===id);if(subtask)subtask.completed=checked;saveWorkflows();renderSteps();}
        function addComment(stepIdx,text){if(!text)return;let wf=workflows[selectedWf];if(!wf.steps[stepIdx].comments)wf.steps[stepIdx].comments=[];wf.steps[stepIdx].comments.push({user:currentUser,text,date:new Date().toLocaleString()});saveWorkflows();renderSteps();}
        function addStep(name,desc,dueDate){let wf=workflows[selectedWf];if(!wf.steps)wf.steps=[];wf.steps.push({name,description:desc,dueDate,status:'pending'});if(wf.currentIdx===undefined)wf.currentIdx=0;saveWorkflows();renderSteps();renderStepsChart();}
        function createWorkflow(name){workflows.push({name,steps:[],objetivos:[],currentIdx:0});saveWorkflows();renderWorkflows();updateStats();}
        function deleteWorkflow(){if(selectedWf!==null){workflows.splice(selectedWf,1);selectedWf=null;document.getElementById('workflowPanel').classList.add('hidden');saveWorkflows();renderWorkflows();updateStats();}}
        function deleteAllWorkflows(){workflows=[];selectedWf=null;document.getElementById('workflowPanel').classList.add('hidden');saveWorkflows();renderWorkflows();updateStats();}
        function renderWorkflowsChart(){let ctx=document.getElementById('chartWorkflows').getContext('2d');if(wfChart)wfChart.destroy();let labels=workflows.map(w=>w.name);let data=workflows.map(w=>{let total=w.objetivos?.length||0;let completed=w.objetivos?.filter(o=>o.completed).length||0;return total?Math.round(completed/total*100):0;});wfChart=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Progresso (%)',data,backgroundColor:'#8B5CF6',borderColor:'#FFD700',borderWidth:1,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:'#fff'}}},scales:{y:{grid:{color:'#333'},ticks:{color:'#fff'}},x:{ticks:{color:'#fff'}}}}});}
        function renderStepsChart(){let wf=workflows[selectedWf];if(!wf||!wf.steps?.length)return;let ctx=document.getElementById('chartSteps').getContext('2d');if(stepsChart)stepsChart.destroy();let labels=wf.steps.map((s,i)=>`Etapa ${i+1}`);let data=wf.steps.map(s=>s.status==='completed'?100:(s.status==='progress'?50:0));stepsChart=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Progresso (%)',data,backgroundColor:'#FFD700',borderColor:'#8B5CF6',borderWidth:1,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:'#fff'}}},scales:{y:{grid:{color:'#333'},ticks:{color:'#fff'}},x:{ticks:{color:'#fff'}}}}});}
        function register(u,p){if(users[u]){document.getElementById('loginMsg').innerHTML='❌ Usuário existe';return false;}users[u]={password:p};saveUsers();document.getElementById('loginMsg').innerHTML='✅ Conta criada! Faça login.';return true;}
        function login(u,p){if(!users[u]||users[u].password!==p){document.getElementById('loginMsg').innerHTML='❌ Dados inválidos';return false;}currentUser=u;loadWorkflows();document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainScreen').classList.remove('hidden');document.getElementById('workflowPanel').classList.add('hidden');selectedWf=null;updateClock();return true;}
        function logout(){currentUser=null;workflows=[];selectedWf=null;document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('mainScreen').classList.add('hidden');}
        function changePassword(oldP,newP,conf){if(newP.length<4){alert('Min 4');return false;}if(newP!==conf){alert('Senhas não conferem');return false;}if(users[currentUser].password!==oldP){alert('Senha atual incorreta');return false;}users[currentUser].password=newP;saveUsers();alert('Senha alterada!');return true;}
        function deleteAccount(){if(confirm('Excluir conta permanentemente?')){delete users[currentUser];saveUsers();logout();alert('Conta excluída');}}

        document.getElementById('btnLogin').onclick=()=>{let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;if(u&&p)login(u,p);else alert('Preencha todos os campos');};
        document.getElementById('btnReg').onclick=()=>{let u=document.getElementById('regUser').value.trim(),p=document.getElementById('regPass').value;if(u&&p&&p.length>=4)register(u,p);else alert('Usuário e senha (min 4)');};
        document.getElementById('showReg').onclick=()=>{document.getElementById('loginPanel').classList.add('hidden');document.getElementById('regPanel').classList.remove('hidden');};
        document.getElementById('backLogin').onclick=()=>{document.getElementById('regPanel').classList.add('hidden');document.getElementById('loginPanel').classList.remove('hidden');};
        document.getElementById('logoutBtn').onclick=()=>{logout();};
        document.getElementById('createWf').onclick=()=>{let name=document.getElementById('newWfName').value.trim();if(name){createWorkflow(name);document.getElementById('newWfName').value='';}else alert('Digite um nome');};
        document.getElementById('deleteWf').onclick=()=>{if(selectedWf!==null)deleteWorkflow();else alert('Selecione um workflow');};
        document.getElementById('addObjetivo').onclick=()=>{if(selectedWf===null){alert('Selecione um workflow');return;}addObjetivo(document.getElementById('newObjTitle').value,document.getElementById('newObjDesc').value,document.getElementById('newObjDate').value,document.getElementById('newObjPriority').value);document.getElementById('newObjTitle').value='';document.getElementById('newObjDesc').value='';};
        document.getElementById('addStep').onclick=()=>{if(selectedWf===null){alert('Selecione um workflow');return;}addStep(document.getElementById('newStepName').value,document.getElementById('newStepDesc').value,document.getElementById('newStepDate').value);document.getElementById('newStepName').value='';document.getElementById('newStepDesc').value='';document.getElementById('newStepDate').value='';};
        document.getElementById('closeWfPanel').onclick=()=>{selectedWf=null;document.getElementById('workflowPanel').classList.add('hidden');renderWorkflows();};
        document.getElementById('saveAndExit').onclick=()=>{selectedWf=null;document.getElementById('workflowPanel').classList.add('hidden');renderWorkflows();updateStats();};
        document.getElementById('openSettings').onclick=()=>{document.getElementById('settingsModal').style.display='flex';};
        document.getElementById('closeModal').onclick=()=>{document.getElementById('settingsModal').style.display='none';};
        document.getElementById('changePassBtn').onclick=()=>{let old=document.getElementById('oldPass').value,n1=document.getElementById('newPass').value,n2=document.getElementById('confirmPass').value;changePassword(old,n1,n2);};
        document.getElementById('deleteAllWfBtn').onclick=()=>{if(confirm('Excluir TODOS workflows?'))deleteAllWorkflows();};
        document.getElementById('deleteAccountBtn').onclick=()=>{deleteAccount();};
        document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('tabSeg').classList.toggle('hidden',t.dataset.tab!='seg');document.getElementById('tabPerigo').classList.toggle('hidden',t.dataset.tab!='perigo');};});

        function createEnergyParticles(){const c=document.getElementById('energyFlow');if(!c)return;for(let i=0;i<30;i++){let p=document.createElement('div');p.className='energy-particle';p.style.top=Math.random()*100+'%';p.style.animationDelay=Math.random()*8+'s';p.style.animationDuration=6+Math.random()*6+'s';c.appendChild(p);}
        for(let i=0;i<30;i++){let p=document.createElement('div');p.className='energy-particle-vertical';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*10+'s';p.style.animationDuration=8+Math.random()*6+'s';c.appendChild(p);}}
        for(let i=0;i<50;i++){let p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*10+'s';p.style.animationDuration=8+Math.random()*8+'s';document.querySelector('.animated-bg').appendChild(p);}
        createEnergyParticles();loadData();
    </script>
</body>
</html>
